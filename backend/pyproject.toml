[project]
name = "constructure-rag"
version = "0.1.0"
description = "Constructure AI RAG Assignment - Project Brain for Construction Documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "pwdlib[argon2]>=0.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "qdrant-client>=1.12.0",
    "uvicorn[standard]>=0.32.0",
    "fastembed>=0.7.0",
    "rank-bm25>=0.2.2",
    "email-validator>=2.3.0",
    "pymupdf>=1.26.6",
    "streamlit>=1.51.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "streamlit>=1.40.0",
]

ollama = [
    "ollama>=0.4.0",
]

openai = [
    "openai>=1.55.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
